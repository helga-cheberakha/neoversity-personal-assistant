[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-backend"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic[email]>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
